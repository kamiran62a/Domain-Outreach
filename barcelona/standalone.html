<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>برشلونة عبر التاريخ</title>
<style>
:root {
  --blue: #004d98;
  --blue-dark: #00306a;
  --garnet: #a50044;
  --gold: #edbb00;
  --bg: #f4f5f7;
  --surface: #ffffff;
  --text: #1a1c22;
  --text-muted: #5b6270;
  --border: #e1e4ea;
  --verified: #1a7f4b;
  --verified-bg: #e5f6ec;
  --reconstructed: #9a6b00;
  --reconstructed-bg: #fdf1d6;
  --radius: 10px;
  --font: Tahoma, "Segoe UI", "Noto Sans Arabic", "Geeza Pro", Arial, sans-serif;
}

:root[data-theme="dark"] {
  --bg: #14161c;
  --surface: #1d2029;
  --text: #eef0f4;
  --text-muted: #a2a8b6;
  --border: #2b2f3a;
  --verified: #4ad493;
  --verified-bg: #113224;
  --reconstructed: #f0b93d;
  --reconstructed-bg: #382b0d;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14161c;
    --surface: #1d2029;
    --text: #eef0f4;
    --text-muted: #a2a8b6;
    --border: #2b2f3a;
    --verified: #4ad493;
    --verified-bg: #113224;
    --reconstructed: #f0b93d;
    --reconstructed-bg: #382b0d;
  }
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  overflow-x: hidden;
}

body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

a { color: inherit; }

.site-header {
  background: linear-gradient(135deg, var(--blue) 0%, var(--blue-dark) 100%);
  color: #fff;
  padding: 18px 20px;
}

.header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  max-width: 1100px;
  margin: 0 auto;
  flex-wrap: wrap;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.crest {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--garnet);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 18px;
  border: 2px solid var(--gold);
  flex-shrink: 0;
}

.brand h1 {
  font-size: 1.25rem;
  margin: 0;
  line-height: 1.3;
}

.brand p {
  margin: 0;
  font-size: 0.8rem;
  color: rgba(255,255,255,0.75);
}

.header-actions {
  display: flex;
  gap: 8px;
}

.btn {
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.35);
  color: #fff;
  padding: 7px 14px;
  border-radius: 999px;
  font-size: 0.85rem;
  cursor: pointer;
  font-family: inherit;
}
.btn:hover { background: rgba(255,255,255,0.22); }
.btn.active { background: var(--gold); color: #1a1c22; border-color: var(--gold); }

.stats-bar {
  max-width: 1100px;
  margin: 16px auto 0;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
  gap: 10px;
}

.stat-tile {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: var(--radius);
  padding: 10px 12px;
  text-align: center;
}
.stat-tile .num { font-size: 1.3rem; font-weight: 700; }
.stat-tile .label { font-size: 0.72rem; color: rgba(255,255,255,0.75); }

main {
  flex: 1;
  max-width: 1100px;
  width: 100%;
  margin: 0 auto;
  padding: 18px 20px 60px;
}

.controls {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 18px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.search-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.search-row input[type="text"], .search-row select {
  flex: 1;
  min-width: 160px;
  padding: 9px 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  font-family: inherit;
  font-size: 0.9rem;
}

.decade-chips {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 4px;
}

.chip {
  flex-shrink: 0;
  padding: 6px 12px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  font-size: 0.8rem;
  cursor: pointer;
  white-space: nowrap;
  font-family: inherit;
}
.chip.active { background: var(--blue); border-color: var(--blue); color: #fff; }

.toggle-row {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 0.85rem;
  color: var(--text-muted);
}

#search-results {
  margin-bottom: 18px;
}

.badge {
  display: inline-block;
  font-size: 0.68rem;
  font-weight: 700;
  padding: 3px 9px;
  border-radius: 999px;
}
.badge.verified { background: var(--verified-bg); color: var(--verified); }
.badge.reconstructed { background: var(--reconstructed-bg); color: var(--reconstructed); }

.decade-group summary {
  cursor: pointer;
  font-weight: 700;
  padding: 10px 4px;
  font-size: 1.05rem;
  color: var(--blue);
  list-style: none;
}
:root[data-theme="dark"] .decade-group summary,
@media (prefers-color-scheme: dark) { .decade-group summary { color: #6fa8dc; } }
.decade-group summary::-webkit-details-marker { display: none; }
.decade-group summary::before { content: "▸ "; }
.decade-group[open] summary::before { content: "▾ "; }

.season-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 10px;
  padding: 4px 0 16px;
}

.season-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  cursor: pointer;
  transition: border-color .15s ease;
}
.season-card:hover { border-color: var(--blue); }
.season-card .row1 {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}
.season-card .label { font-weight: 700; }
.season-card .meta { font-size: 0.78rem; color: var(--text-muted); }
.season-card .trophies { font-size: 0.78rem; margin-top: 4px; }

.detail-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
}

.detail-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 12px;
}

.back-link {
  display: inline-block;
  margin-bottom: 14px;
  color: var(--blue);
  cursor: pointer;
  font-size: 0.9rem;
}

.disclaimer-banner {
  background: var(--reconstructed-bg);
  color: var(--reconstructed);
  border: 1px solid var(--reconstructed);
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 0.85rem;
  margin-bottom: 14px;
}

.match-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 6px;
  border-bottom: 1px solid var(--border);
  font-size: 0.9rem;
  flex-wrap: wrap;
}
.match-row:last-child { border-bottom: none; }
.match-date { color: var(--text-muted); font-size: 0.78rem; width: 90px; flex-shrink: 0; }
.match-competition { font-size: 0.72rem; color: var(--text-muted); background: var(--bg); border-radius: 6px; padding: 2px 7px; }
.match-teams { flex: 1; min-width: 180px; font-weight: 600; }
.match-score { font-weight: 700; color: var(--blue); }
.match-notes { width: 100%; font-size: 0.8rem; color: var(--text-muted); font-style: italic; }
.match-row.notable { background: var(--verified-bg); border-radius: 8px; }

.error-banner, .empty-state {
  padding: 20px;
  text-align: center;
  color: var(--text-muted);
}

.site-footer {
  border-top: 1px solid var(--border);
  padding: 16px 20px;
  font-size: 0.78rem;
  color: var(--text-muted);
  text-align: center;
}
.site-footer a { color: var(--blue); }

@media (max-width: 560px) {
  .brand h1 { font-size: 1.05rem; }
  .stats-bar { grid-template-columns: repeat(3, 1fr); }
  .match-teams { min-width: 140px; }
}

</style>
</head>
<body>
<header class="site-header">
  <div class="header-row">
    <div class="brand">
      <div class="crest">FCB</div>
      <div>
        <h1>برشلونة عبر التاريخ</h1>
        <p id="subtitle">نتائج مباريات نادي برشلونة من أول مباراة رسمية حتى اليوم</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn" id="lang-toggle" type="button">EN</button>
    </div>
  </div>
  <div class="stats-bar" id="stats-bar"></div>
</header>

<main>
  <div class="controls" id="controls">
    <div class="search-row">
      <input type="text" id="search-input" placeholder="ابحث عن خصم…">
      <select id="competition-select"></select>
      <button class="btn" id="verified-toggle" type="button" style="background:transparent;border-color:var(--border);color:var(--text);"></button>
    </div>
    <div class="decade-chips" id="decade-chips"></div>
  </div>

  <div id="search-results"></div>
  <div id="season-list"></div>
  <div id="detail-panel" hidden></div>
</main>

<footer class="site-footer">
  <p id="footer-note"></p>
  <p>مصدر البيانات: <a href="https://github.com/openfootball/espana" target="_blank" rel="noopener">openfootball/espana</a>, <a href="https://github.com/openfootball/champions-league" target="_blank" rel="noopener">openfootball/champions-league</a></p>
</footer>

const STRINGS = {
  ar: {
    title: "برشلونة عبر التاريخ",
    subtitle: "نتائج مباريات نادي برشلونة من أول مباراة رسمية حتى اليوم",
    langToggle: "EN",
    searchPlaceholder: "ابحث عن خصم (مثال: Real Madrid)…",
    allCompetitions: "كل البطولات",
    verifiedOnly: "الموثّق فقط",
    showAll: "عرض الكل",
    seasons: "موسم",
    matches: "مباراة",
    wins: "فوز",
    trophies: "لقب",
    verifiedBadge: "موثّق",
    reconstructedBadge: "معاد بناؤه",
    back: "‹ رجوع لقائمة المواسم",
    played: "لعب",
    won: "فاز",
    drawn: "تعادل",
    lost: "خسر",
    goalsFor: "له",
    goalsAgainst: "عليه",
    notFound: "الموسم غير موجود",
    noMatches: "لا توجد مباريات مسجلة لهذا الموسم",
    searchResultsFor: "نتائج البحث عن",
    noSearchResults: "لا توجد نتائج",
    footerNote: "بيانات مواسم 2012-13 إلى 2025-26 (الدوري وأبطال أوروبا) مصدرها مشروع openfootball المفتوح. بيانات ما قبل ذلك معادة بناؤها من المعرفة العامة للنموذج وقد تحتوي أخطاء أو نقصاً — راجع تنويه كل موسم.",
  },
  en: {
    title: "FC Barcelona Through History",
    subtitle: "Every recorded FC Barcelona result, from the first official match to today",
    langToggle: "AR",
    searchPlaceholder: "Search opponent (e.g. Real Madrid)…",
    allCompetitions: "All competitions",
    verifiedOnly: "Verified only",
    showAll: "Show all",
    seasons: "seasons",
    matches: "matches",
    wins: "wins",
    trophies: "trophies",
    verifiedBadge: "Verified",
    reconstructedBadge: "Reconstructed",
    back: "‹ Back to seasons",
    played: "P",
    won: "W",
    drawn: "D",
    lost: "L",
    goalsFor: "GF",
    goalsAgainst: "GA",
    notFound: "Season not found",
    noMatches: "No recorded matches for this season",
    searchResultsFor: "Search results for",
    noSearchResults: "No results",
    footerNote: "2012-13 to 2025-26 league & Champions League data comes from the open openfootball project. Earlier seasons are reconstructed from the model's general knowledge and may contain errors or gaps — see each season's notice.",
  },
};
function t(key, lang) { return (STRINGS[lang] && STRINGS[lang][key]) || STRINGS.en[key] || key; }

function esc(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function decadeOf(id) { const y = parseInt(id.split("-")[0], 10); return `${Math.floor(y/10)*10}s`; }

const MANIFEST_SEASONS = SEASONS_DATA.map((s) => ({
  id: s.id, label_ar: s.label_ar, label_en: s.label_en, decade: decadeOf(s.id),
  source: s.source, competitions: (s.summary && s.summary.competitions) || [],
  league_position: s.summary && s.summary.league_position,
  played: s.summary && s.summary.played, won: s.summary && s.summary.won,
  drawn: s.summary && s.summary.drawn, lost: s.summary && s.summary.lost,
  goals_for: s.summary && s.summary.goals_for, goals_against: s.summary && s.summary.goals_against,
  trophies: (s.summary && s.summary.trophies) || [],
  match_count: (s.matches || []).length,
}));

const SEARCH_INDEX = SEASONS_DATA.flatMap((s) =>
  (s.matches || []).map((m) => ({
    season_id: s.id, date: m.date, competition: m.competition, home: m.home, away: m.away,
    score: m.score, round: m.round, notes: m.notes, is_notable: m.is_notable,
  }))
);

const SEASONS_BY_ID = Object.fromEntries(SEASONS_DATA.map((s) => [s.id, s]));

const state = {
  lang: localStorage.getItem("bcn_lang") || "ar",
  query: "", competition: "all", decade: "all", verifiedOnly: false,
};

const els = {
  statsBar: document.getElementById("stats-bar"),
  langToggle: document.getElementById("lang-toggle"),
  searchInput: document.getElementById("search-input"),
  competitionSelect: document.getElementById("competition-select"),
  decadeChips: document.getElementById("decade-chips"),
  verifiedToggle: document.getElementById("verified-toggle"),
  searchResults: document.getElementById("search-results"),
  seasonList: document.getElementById("season-list"),
  detailPanel: document.getElementById("detail-panel"),
  subtitle: document.getElementById("subtitle"),
  footerNote: document.getElementById("footer-note"),
  controls: document.getElementById("controls"),
};

function applyLangDom() {
  document.documentElement.lang = state.lang;
  document.documentElement.dir = state.lang === "ar" ? "rtl" : "ltr";
  els.langToggle.textContent = t("langToggle", state.lang);
  els.searchInput.placeholder = t("searchPlaceholder", state.lang);
  els.verifiedToggle.textContent = state.verifiedOnly ? t("showAll", state.lang) : t("verifiedOnly", state.lang);
  els.subtitle.textContent = t("subtitle", state.lang);
  els.footerNote.textContent = t("footerNote", state.lang);
  document.title = t("title", state.lang);
  const opt = els.competitionSelect.querySelector('option[value="all"]');
  if (opt) opt.textContent = t("allCompetitions", state.lang);
}

function renderStatsHeader() {
  let totalMatches = 0, wins = 0, trophies = 0;
  for (const s of MANIFEST_SEASONS) {
    totalMatches += s.match_count || 0;
    if (typeof s.won === "number") wins += s.won;
    if (Array.isArray(s.trophies)) trophies += s.trophies.length;
  }
  els.statsBar.innerHTML = `
    <div class="stat-tile"><div class="num">${MANIFEST_SEASONS.length}</div><div class="label">${esc(t("seasons", state.lang))}</div></div>
    <div class="stat-tile"><div class="num">${totalMatches}</div><div class="label">${esc(t("matches", state.lang))}</div></div>
    <div class="stat-tile"><div class="num">${wins}</div><div class="label">${esc(t("wins", state.lang))}</div></div>
    <div class="stat-tile"><div class="num">${trophies}</div><div class="label">${esc(t("trophies", state.lang))}</div></div>
  `;
}

function badge(source) {
  const cls = source === "verified" ? "verified" : "reconstructed";
  const label = source === "verified" ? t("verifiedBadge", state.lang) : t("reconstructedBadge", state.lang);
  return `<span class="badge ${cls}">${esc(label)}</span>`;
}

function groupByDecade(seasons) {
  const groups = {};
  for (const s of seasons) (groups[s.decade] = groups[s.decade] || []).push(s);
  return groups;
}

function filteredSeasons() {
  return MANIFEST_SEASONS.filter((s) => {
    if (state.verifiedOnly && s.source !== "verified") return false;
    if (state.decade !== "all" && s.decade !== state.decade) return false;
    if (state.competition !== "all" && !(s.competitions || []).includes(state.competition)) return false;
    return true;
  });
}

function openSeason(id) { window.location.hash = `#/season/${id}`; }
function goBack() { window.location.hash = "#/"; }

function renderSeasonList() {
  const seasonsByDecade = groupByDecade(filteredSeasons());
  const el = els.seasonList;
  el.innerHTML = "";
  const decades = Object.keys(seasonsByDecade).sort();
  for (const decade of decades) {
    const seasons = seasonsByDecade[decade];
    if (!seasons.length) continue;
    const details = document.createElement("details");
    details.className = "decade-group";
    details.open = decade === decades[decades.length - 1];
    const summary = document.createElement("summary");
    summary.textContent = `${decade} (${seasons.length})`;
    details.appendChild(summary);
    const grid = document.createElement("div");
    grid.className = "season-grid";
    for (const s of seasons) {
      const card = document.createElement("div");
      card.className = "season-card";
      const label = state.lang === "ar" ? s.label_ar : s.label_en;
      const record = (typeof s.played === "number")
        ? `${t("played", state.lang)} ${s.played} · ${t("won", state.lang)} ${s.won} · ${t("drawn", state.lang)} ${s.drawn} · ${t("lost", state.lang)} ${s.lost}`
        : `${s.match_count || 0} ${t("matches", state.lang)}`;
      const trophyLine = (s.trophies && s.trophies.length) ? `🏆 ${s.trophies.join(" · ")}` : "";
      card.innerHTML = `
        <div class="row1"><span class="label">${esc(label)}</span>${badge(s.source)}</div>
        <div class="meta">${esc((s.competitions || []).join(", "))}</div>
        <div class="meta">${esc(record)}</div>
        <div class="trophies">${esc(trophyLine)}</div>
      `;
      card.addEventListener("click", () => openSeason(s.id));
      grid.appendChild(card);
    }
    details.appendChild(grid);
    el.appendChild(details);
  }
  if (!el.children.length) el.innerHTML = `<div class="empty-state">${esc(t("noSearchResults", state.lang))}</div>`;
}

function matchRow(m) {
  const home = esc(m.home || "?"), away = esc(m.away || "?");
  const score = m.score ? esc(m.score) : "—";
  const notable = m.is_notable ? " notable" : "";
  const notes = m.notes ? `<div class="match-notes">${esc(m.notes)}</div>` : "";
  return `
    <div class="match-row${notable}">
      <div class="match-date" dir="ltr">${esc(m.date || "")}</div>
      <div class="match-competition" dir="ltr">${esc(m.competition || "")}${m.round ? " · " + esc(m.round) : ""}</div>
      <div class="match-teams" dir="ltr">${home} <span class="match-score">${score}</span> ${away}</div>
      ${notes}
    </div>
  `;
}

function renderSeasonDetail(season) {
  const label = state.lang === "ar" ? season.label_ar : season.label_en;
  const disclaimer = state.lang === "ar" ? season.disclaimer_ar : season.disclaimer_en;
  const s = season.summary || {};
  const recordLine = (typeof s.played === "number")
    ? `${t("played", state.lang)} ${s.played} · ${t("won", state.lang)} ${s.won} · ${t("drawn", state.lang)} ${s.drawn} · ${t("lost", state.lang)} ${s.lost} · ${t("goalsFor", state.lang)} ${s.goals_for} · ${t("goalsAgainst", state.lang)} ${s.goals_against}`
    : "";
  const el = els.detailPanel;
  el.innerHTML = `
    <div class="back-link">${esc(t("back", state.lang))}</div>
    <div class="detail-header">
      <div>
        <h2 style="margin:0 0 4px;">${esc(label)}</h2>
        <div class="meta" style="color:var(--text-muted);font-size:0.85rem;">${esc((s.competitions || []).join(", "))}</div>
      </div>
      ${badge(season.source)}
    </div>
    ${disclaimer ? `<div class="disclaimer-banner">${esc(disclaimer)}</div>` : ""}
    ${recordLine ? `<div class="meta" style="margin-bottom:10px;">${esc(recordLine)}</div>` : ""}
    ${(s.trophies && s.trophies.length) ? `<div style="margin-bottom:14px;">🏆 ${esc(s.trophies.join(" · "))}</div>` : ""}
    <div class="matches-list">
      ${(season.matches && season.matches.length) ? season.matches.map(matchRow).join("") : `<div class="empty-state">${esc(t("noMatches", state.lang))}</div>`}
    </div>
  `;
  el.querySelector(".back-link").addEventListener("click", goBack);
}

function renderError(el, message) { el.innerHTML = `<div class="error-banner">${esc(message)}</div>`; }

function renderSearchResults() {
  const el = els.searchResults;
  const query = state.query;
  if (!query) { el.innerHTML = ""; return; }
  const q = query.trim().toLowerCase();
  const results = SEARCH_INDEX.filter((m) =>
    (m.home && m.home.toLowerCase().includes(q)) || (m.away && m.away.toLowerCase().includes(q))
  );
  if (!results.length) { el.innerHTML = `<div class="empty-state">${esc(t("noSearchResults", state.lang))}</div>`; return; }
  el.innerHTML = `<h3 style="margin:0 0 8px;font-size:0.95rem;">${esc(t("searchResultsFor", state.lang))} "${esc(query)}" (${results.length})</h3>` +
    `<div class="detail-panel">` + results.slice(0, 100).map(matchRow).join("") + `</div>`;
  el.querySelectorAll(".match-row").forEach((row, i) => {
    row.style.cursor = "pointer";
    row.addEventListener("click", () => openSeason(results[i].season_id));
  });
}

function renderListView() {
  els.detailPanel.hidden = true;
  els.detailPanel.innerHTML = "";
  els.controls.hidden = false;
  if (state.query) { els.seasonList.hidden = true; return; }
  els.seasonList.hidden = false;
  renderSeasonList();
}

function renderDetailView(id) {
  els.controls.hidden = true;
  els.seasonList.hidden = true;
  els.searchResults.innerHTML = "";
  els.detailPanel.hidden = false;
  const season = SEASONS_BY_ID[id];
  if (!season) { renderError(els.detailPanel, t("notFound", state.lang)); return; }
  renderSeasonDetail(season);
}

function runSearch() {
  if (!state.query) { els.searchResults.innerHTML = ""; renderListView(); return; }
  els.seasonList.hidden = true;
  renderSearchResults();
}

function populateFilters() {
  const decades = [...new Set(MANIFEST_SEASONS.map((s) => s.decade))].sort();
  els.decadeChips.innerHTML = `<button class="chip active" data-decade="all">${t("showAll", state.lang)}</button>` +
    decades.map((d) => `<button class="chip" data-decade="${d}">${d}</button>`).join("");
  els.decadeChips.querySelectorAll(".chip").forEach((chip) => {
    chip.addEventListener("click", () => {
      state.decade = chip.dataset.decade;
      els.decadeChips.querySelectorAll(".chip").forEach((c) => c.classList.toggle("active", c === chip));
      renderListView();
    });
  });
  const competitions = [...new Set(MANIFEST_SEASONS.flatMap((s) => s.competitions || []))].sort();
  els.competitionSelect.innerHTML = `<option value="all">${t("allCompetitions", state.lang)}</option>` +
    competitions.map((c) => `<option value="${c}">${c}</option>`).join("");
}

function route() {
  const hash = window.location.hash;
  const m = hash.match(/^#\/season\/(.+)$/);
  if (m) renderDetailView(decodeURIComponent(m[1]));
  else renderListView();
}

function wireEvents() {
  els.langToggle.addEventListener("click", () => {
    state.lang = state.lang === "ar" ? "en" : "ar";
    localStorage.setItem("bcn_lang", state.lang);
    applyLangDom();
    populateFilters();
    renderStatsHeader();
    route();
  });
  let debounceTimer;
  els.searchInput.addEventListener("input", (e) => {
    clearTimeout(debounceTimer);
    const value = e.target.value;
    debounceTimer = setTimeout(() => { state.query = value; runSearch(); }, 200);
  });
  els.competitionSelect.addEventListener("change", (e) => { state.competition = e.target.value; renderListView(); });
  els.verifiedToggle.addEventListener("click", () => {
    state.verifiedOnly = !state.verifiedOnly;
    els.verifiedToggle.textContent = state.verifiedOnly ? t("showAll", state.lang) : t("verifiedOnly", state.lang);
    renderListView();
  });
  window.addEventListener("hashchange", route);
}

applyLangDom();
wireEvents();
renderStatsHeader();
populateFilters();
route();

</script>
